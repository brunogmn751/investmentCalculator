<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>investment Calculator</title>
    <link href="./src/style.css" rel="stylesheet" />
    <script type="module" src="./src/main.js" defer></script>
  </head>
  <body class="min-h-dvh h-dvh grid grid-rows-2 grid-cols-3">
    <aside
      class="row-span-2 bg-emerald-300 flex flex-col justify-around items-center"
    >
      <h1 class="text-2xl text-center font-bold px-6 py-2">
        Investment Calculator
      </h1>
      <form id="investment-form" class="w-full flex">
        <div class="flex flex-col w-full gap-4 px">
          <div class="flex flex-col w-full px-3 min-h-[4.25rem]">
            <label class="font-bold text-gray-700" for="initial-investment"
              >Initial Investment</label
            >
            <div class="flex gap-0">
              <input
                class="bg-emerald-200 rounded-l-md px-2 w-1/8 font-medium text-center"
                value="R$"
                type="text"
                disabled
              />
              <input
                class="bg-white w-7/8 pl-2 rounded-r-md"
                type="text"
                placeholder="0,00"
                id="initial-investment"
                name="initial-investment"
                required
              />
            </div>
          </div>
          <div class="flex flex-col w-full px-3 min-h-[4.25rem]">
            <label
              class="font-bold text-gray-700"
              for="additional-contributions"
              >Additional Contributions</label
            >
            <div class="flex gap-0">
              <input
                class="bg-emerald-200 rounded-l-md px-2 w-1/8 font-medium text-center"
                value="R$"
                type="text"
                disabled
              />
              <input
                class="bg-white w-7/8 pl-2 rounded-r-md"
                type="text"
                placeholder="0,00"
                id="additional-contributions"
                name="additional-contributions"
              />
            </div>
          </div>
          <div class="flex flex-col w-full px-3 min-h-[4.25rem]">
            <label class="font-bold text-gray-700" for="time-amount"
              >Time</label
            >
            <div class="flex gap-0">
              <input
                class="bg-white w-5/8 rounded-l-md"
                type="text"
                id="time-amount"
                name="time-amount"
                required
              />
              <select
                class="bg-emerald-100 rounded-r-md text-center w-3/8"
                id="time-period-select"
              >
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
          </div>
          <div class="flex flex-col w-full px-3 min-h-[4.25rem]">
            <label class="font-bold text-gray-700" for="return-rate"
              >Rentability</label
            >
            <div class="flex gap-0">
              <input
                class="bg-emerald-200 rounded-l-md px-2 w-1/8 font-bold text-center"
                value="%"
                type="text"
                disabled
              />
              <input
                class="bg-white w-1/2 px-3"
                type="text"
                id="return-rate"
                name="return-rate"
                placeholder="0"
                required
              />
              <select
                class="bg-emerald-100 rounded-r-md text-center w-3/8"
                id="evaluation-period"
              >
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
          </div>
          <div class="flex flex-col w-full px-3 min-h-[4.25rem]">
            <label class="font-bold text-gray-700" for="tax-rate"
              >Tax Over Profit</label
            >
            <!-- When there's an error this div needs to aquire the class error -->
            <div class="flex gap-0">
              <input
                class="bg-emerald-200 rounded-l-md px-2 w-1/8 font-bold text-center"
                value="%"
                type="text"
                disabled
              />
              <input
                class="bg-white w-7/8 rounded-r-md pl-3"
                type="text"
                placeholder="0"
                id="tax-rate"
                name="tax-rate"
                required
              />
            </div>
          </div>
        </div>
      </form>
      <div class="flex h-12 px-6 gap-3 w-full justify-center">
        <button
          class="bg-emerald-700 text-white w-1/3 rounded-md font-bold hover:bg-emerald-800 transition-all"
          id="calculate-btn"
          form="investment-form"
        >
          Calculate
        </button>
        <button
          class="bg-emerald-500 text-white w-1/3 rounded-md font-bold hover:bg-emerald-600 transition-all" form="investment-form" type="reset" id="reset-btn">
          Clear
        </button>
      </div>
    </aside>
    <main class="row-span-2 col-span-2">
       <!-- <section id="charts-container" class="h-full">
        <div class="h-5/12 flex flex-col items-center justify-center p-6">
          <p class="font-bold text-lg ">Final Result</p>
          <canvas id="final-money-distribution" class="max-h-full"></canvas>
        </div>
        <div class="h-7/12 flex flex-col items-center justify-center p-6">
          <p class="font-bold text-lg ">Progression</p>
          <canvas id="progression" class="max-h-full"></canvas>
        </div>
       </section> -->
       <section id="tables-container" class="h-full">
        <p class="font-bold text-lg text-center">Monthly Results</p>
        <table class="w-full max-h-full border-1 border-separate">
          <thead>
            <th>Month</th>
            <th>Returns</th>
            <th>Invested Amount</th>
          </thead>
          <tbody>
            <tr>
              <td class="text-center">0</td>
              <td class="text-center">0</td>
              <td class="text-center">10000</td>
            </tr>
          </tbody>
        </table>
       </section>
      </main>
  </body>
</html>
